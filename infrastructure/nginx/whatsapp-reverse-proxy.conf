# Nginx Reverse Proxy Configuration for Mai WhatsApp Microservice
# Deployed on Oracle Cloud Always Free Ampere A1 VM (144.24.209.195)
# File on VM: /etc/nginx/sites-available/default (symlinked to /etc/nginx/sites-enabled/default)

server {
    listen 80 default_server;
    server_name 144.24.209.195;

    # Automated Let's Encrypt ACME challenge endpoint
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    # Reject all other unencrypted HTTP traffic
    location / {
        return 404;
    }
}

server {
    listen 443 ssl default_server;
    server_name 144.24.209.195;
    server_tokens off;

    # Automated Let's Encrypt TLS Certificates
    ssl_certificate /etc/letsencrypt/live/144.24.209.195/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/144.24.209.195/privkey.pem;

    # Security headers
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # 1. Health & Connection Status
    location = /status {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. QR Code Pairing Page & API
    location = /qr {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Session Reset (Protected by API Bearer Key)
    location = /reset-session {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Outbound Message Dispatch (Protected by API Bearer Key)
    location = /send-message {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Strict deny for any unlisted endpoint (e.g. /health or root)
    location / {
        return 404;
    }
}
