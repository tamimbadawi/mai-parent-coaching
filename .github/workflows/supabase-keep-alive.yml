name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 06:00 UTC
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  ping-supabase:
    name: Ping Supabase Auth Health
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth Health Endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${{ secrets.SUPABASE_URL }}/auth/v1/health")
          
          echo "Supabase Auth health endpoint returned HTTP status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Ping successful! Database and Auth service are active."
            exit 0
          else
            echo "Failed to reach Supabase Auth health endpoint with status $HTTP_STATUS"
            exit 1
          fi
