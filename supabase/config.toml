# Supabase Project Configuration

# API Settings
[api]
enabled = true

# Database Settings
[db]
port = 54322
major_version = 15

# Studio Settings
[studio]
enabled = true
port = 54323

# Storage Settings
[storage]
enabled = true

# Auth Settings
[auth]
site_url = "https://mai-parent-coaching.vercel.app"
additional_redirect_urls = [
  "https://mai-parent-coaching.vercel.app/**",
  "https://mai-parent-coaching.vercel.app/auth/callback",
  "https://mai-parent-coaching-asacontracting.vercel.app/**",
  "https://mai-parent-coaching-asacontracting.vercel.app/auth/callback",
  "http://localhost:5173/**",
  "http://localhost:5173/auth/callback",
  "http://localhost:5174/**",
  "http://localhost:5174/auth/callback",
  "http://localhost:3000/**"
]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Functions Settings
[functions.hello-supabase]
verify_jwt = true

[functions.admin-user-manager]
verify_jwt = false

[functions.google-calendar-auth]
verify_jwt = false

[functions.get-availability]
verify_jwt = false

[functions.create-booking]
verify_jwt = false

[functions.verify-calendar-event]
verify_jwt = false

[functions.whatsapp-dispatcher]
verify_jwt = false

[functions.whatsapp-scheduler]
verify_jwt = false

